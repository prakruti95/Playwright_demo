name: Northline Store E2E & API Test CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install --with-deps ${{ matrix.browser }}

      - name: Run Pytest Suite (${{ matrix.browser }})
        env:
          TARGET_URL: "https://ecomcicid.netlify.app"
          MOCK_API_URL: "https://681444af225ff1af16285b31.mockapi.io/electronicapi"
        run: |
          pytest --browser ${{ matrix.browser }} \
                 --html=test-results/report-${{ matrix.browser }}.html \
                 --self-contained-html \
                 -v

      - name: Upload Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts-${{ matrix.browser }}
          path: |
            test-results/
            test-results/report-*.html
            test-results/screenshots/
            test-results/videos/
            test-results/traces/
          retention-days: 14
