[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --html=test-results/report.html
    --self-contained-html
markers =
    smoke: Quick critical path verification tests
    e2e: End-to-end user journey tests across storefront pages
    api: REST API integration, contract, and schema tests
    regression: Full regression test suite covering all functional areas
    catalog: Product catalog and details tests
    cart: Shopping cart and quantity tests
    checkout: Checkout flow and form validation tests
    mobile: Mobile responsive viewport tests
